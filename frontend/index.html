<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia ADS - Agendamento Inteligente</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --disabled-color: #334155;
            --success-color: #22c55e;
            --danger-color: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(56, 189, 248, 0.25);
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        .btn-meus-agendamentos {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-meus-agendamentos:hover {
            background: rgba(56, 189, 248, 0.1);
        }

        h1 {
            color: var(--accent-color);
            text-align: center;
            margin: 0 0 5px 0;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 800;
            font-size: 14px;
            color: var(--text-main);
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 15px;
            box-sizing: border-box;
            font-weight: 750;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        .tabs-categoria {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #475569;
            color: var(--text-muted);
            border-radius: 8px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: #0f172a;
            border-color: var(--accent-color);
        }

        .cards-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 18px;
            scroll-snap-type: x mandatory;
        }

        .cards-container::-webkit-scrollbar {
            height: 6px;
        }

        .cards-container::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 10px;
        }

        .card-corte {
            min-width: 160px;
            max-width: 160px;
            background: #0f172a;
            border: 2px solid #475569;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            scroll-snap-align: start;
        }

        .card-corte img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .card-corte.selected {
            border-color: var(--accent-color);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
            background: rgba(56, 189, 248, 0.1);
        }

        .card-corte h4 {
            margin: 0 0 4px 0;
            font-size: 13px;
            font-weight: 800;
            color: var(--text-main);
        }

        .card-corte .preco {
            font-size: 13px;
            font-weight: 900;
            color: var(--accent-color);
        }

        button.btn-main {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button.btn-main:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
        }

        .horarios-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .horario-btn {
            padding: 10px;
            background: #0f172a;
            border: 1px solid #475569;
            color: var(--text-main);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
            font-weight: 800;
            transition: all 0.2s;
        }

        .horario-btn:hover:not(:disabled) {
            border-color: var(--accent-color);
            background: rgba(56, 189, 248, 0.15);
        }

        .horario-btn.selecionado {
            background: var(--accent-color);
            color: #0f172a;
            font-weight: 900;
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .horario-btn:disabled {
            background: var(--disabled-color);
            color: #64748b;
            border-color: transparent;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        .back-link {
            text-align: center;
            margin-top: 15px;
            color: var(--accent-color);
            cursor: pointer;
            font-size: 13px;
            font-weight: 800;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .whatsapp-notice {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid var(--success-color);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            color: #4ade80;
            margin-bottom: 18px;
            text-align: center;
            font-weight: 700;
        }

        .card-agendamento-ativo {
            background: #0f172a;
            border: 1px solid var(--accent-color);
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-cancelar {
            background: var(--danger-color);
            color: white;
            border: none;
            padding: 8px;
            width: 100%;
            border-radius: 6px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- BARRA DO TOPO -->
        <div class="top-bar">
            <span style="font-size: 12px; font-weight: 900; color: var(--accent-color);">BARBEARIA ADS</span>
            <button class="btn-meus-agendamentos" onclick="abrirMeusAgendamentos()">📅 Meus Agendamentos</button>
        </div>

        <h1>Estilo & Corte</h1>
        <p class="subtitle">Agende seu visual com praticidade</p>

        <!-- ETAPA 1: Identificação -->
        <div id="etapa-1" class="step active">
            <div class="whatsapp-notice">
                📲 Confirmação e lembretes inteligentes direto no seu WhatsApp.
            </div>

            <form id="form-etapa-1">
                <label>Seu Nome:</label>
                <input type="text" id="nome-cliente" placeholder="Ex: Osmar" required>

                <label>Seu WhatsApp:</label>
                <input type="text" id="whatsapp-cliente" placeholder="Ex: 85999999999" required>

                <button type="submit" class="btn-main">Avançar para Agendamento ➔</button>
            </form>
        </div>

        <!-- ETAPA 2: Escolha Visual de Serviço, Dia e Horário -->
        <div id="etapa-2" class="step">
            <p id="saudacao-cliente" style="color: var(--accent-color); font-weight: 900; margin-bottom: 15px; text-align: center; font-size: 15px;"></p>

            <label>Selecione a Categoria:</label>
            <div class="tabs-categoria">
                <button type="button" class="tab-btn active" onclick="filtrarCategoria('masculino', this)">💈 Masculino</button>
                <button type="button" class="tab-btn" onclick="filtrarCategoria('feminino', this)">✂️ Feminino</button>
            </div>

            <label>Escolha o Estilo / Corte:</label>
            <div class="cards-container" id="carrossel-servicos"></div>

            <label>Escolha o Dia:</label>
            <input type="date" id="data-agendamento" required>

            <label>Horários Disponíveis:</label>
            <div class="horarios-grid" id="grade-horarios">
                <button type="button" class="horario-btn" onclick="selecionarHorario(this)">09:00</button>
                <button type="button" class="horario-btn" onclick="selecionarHorario(this)">10:00</button>
                <button type="button" class="horario-btn" disabled>11:00</button>
                <button type="button" class="horario-btn" onclick="selecionarHorario(this)">13:30</button>
                <button type="button" class="horario-btn" onclick="selecionarHorario(this)">14:30</button>
                <button type="button" class="horario-btn" disabled>15:30</button>
                <button type="button" class="horario-btn" onclick="selecionarHorario(this)">17:00</button>
                <button type="button" class="horario-btn" onclick="selecionarHorario(this)">18:00</button>
                <button type="button" class="horario-btn" onclick="selecionarHorario(this)">19:00</button>
            </div>

            <button type="button" class="btn-main" onclick="finalizarAgendamentoNoBanco()">Confirmar Agendamento ✂️</button>
            <div class="back-link" onclick="voltarEtapa1()">← Alterar meus dados</div>
        </div>

        <!-- ETAPA 3: Meus Agendamentos -->
        <div id="etapa-3" class="step">
            <h2 style="font-size: 18px; color: var(--accent-color); text-align: center; margin-bottom: 15px; font-weight: 900;">Seus Agendamentos</h2>
            <div id="lista-meus-agendamentos"></div>
            <button type="button" class="btn-main" style="background: #334155; color: white; margin-top: 10px;" onclick="voltarInicio()">Voltar ao Início</button>
        </div>
    </div>

    <!-- SCRIPT ÚNICO E ORGANIZADO -->
    <script>
        let dadosCliente = { nome: '', whatsapp: '' };
        let servicoSelecionadoId = null;
        let horarioSelecionado = null;
        let todosServicos = [];
        let meuAgendamentoSalvo = null;
        let servicoTextoSalvo = '';

        const hoje = new Date().toISOString().split('T')[0];
        document.getElementById('data-agendamento').min = hoje;
        document.getElementById('data-agendamento').value = hoje;

        window.addEventListener('DOMContentLoaded', () => {
            carregarServicosDoBackend();
        });

        document.getElementById('form-etapa-1').addEventListener('submit', function(e) {
            e.preventDefault();
            dadosCliente.nome = document.getElementById('nome-cliente').value;
            dadosCliente.whatsapp = document.getElementById('whatsapp-cliente').value;

            document.getElementById('saudacao-cliente').textContent = `E aí, ${dadosCliente.nome}! Escolha o estilo e horário:`;
            document.getElementById('etapa-1').classList.remove('active');
            document.getElementById('etapa-2').classList.add('active');

            filtrarCategoria('masculino', document.querySelector('.tab-btn'));
        });

        function voltarEtapa1() {
            document.getElementById('etapa-2').classList.remove('active');
            document.getElementById('etapa-1').classList.add('active');
        }

        function voltarInicio() {
            document.getElementById('etapa-3').classList.remove('active');
            document.getElementById('etapa-1').classList.add('active');
        }

        async function carregarServicosDoBackend() {
            try {
                const resposta = await fetch('http://localhost:3000/servicos');
                todosServicos = await resposta.json();
            } catch (erro) {
                console.error("Erro ao buscar serviços:", erro);
            }
        }

        function filtrarCategoria(categoria, elemento) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(elemento) elemento.classList.add('active');

            const container = document.getElementById('carrossel-servicos');
            container.innerHTML = '';

            const filtrados = todosServicos.filter(s => (s.categoria || 'masculino').toLowerCase() === categoria.toLowerCase());

            if (filtrados.length === 0) {
                const exemplos = categoria === 'masculino' 
                    ? [
                        { id: 1, nome: 'Corte Degradê', preco: '40.00', imagem_url: 'https://images.unsplash.com/photo-1622286342621-4bd786c2447c?w=300' },
                        { id: 2, nome: 'Barba Completa', preco: '30.00', imagem_url: 'https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=300' }
                      ]
                    : [
                        { id: 3, nome: 'Corte Feminino & Escova', preco: '70.00', imagem_url: 'https://images.unsplash.com/photo-1560869713-7d0a29430803?w=300' }
                      ];

                exemplos.forEach(s => renderizarCard(container, s));
            } else {
                filtrados.forEach(s => renderizarCard(container, s));
            }
        }

        function renderizarCard(container, servico) {
            const card = document.createElement('div');
            card.className = 'card-corte';
            card.onclick = () => selecionarCard(card, servico.id, servico.nome, servico.preco);

            const img = servico.imagem_url || 'https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=300';

            card.innerHTML = `
                <img src="${img}" alt="${servico.nome}">
                <h4>${servico.nome}</h4>
                <div class="preco">R$ ${servico.preco}</div>
            `;
            container.appendChild(card);
        }

        function selecionarCard(elemento, id, nome, preco) {
            document.querySelectorAll('.card-corte').forEach(c => c.classList.remove('selected'));
            elemento.classList.add('selected');
            servicoSelecionadoId = id;
            servicoTextoSalvo = `${nome} — R$ ${preco}`;
        }

        function selecionarHorario(elemento) {
            document.querySelectorAll('.horario-btn').forEach(btn => btn.classList.remove('selecionado'));
            elemento.classList.add('selecionado');
            horarioSelecionado = elemento.textContent;
        }

        async function finalizarAgendamentoNoBanco() {
            const data = document.getElementById('data-agendamento').value;

            if (!servicoSelecionadoId) {
                alert('⚠️ Por favor, clique e escolha um corte/estilo no carrossel acima!');
                return;
            }
            if (!data || !horarioSelecionado) {
                alert('⚠️ Por favor, selecione um horário azul para agendar!');
                return;
            }

            const dataHoraFormatada = `${data} ${horarioSelecionado}:00`;

            try {
                const resposta = await fetch('http://localhost:3000/agendamentos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nome: dadosCliente.nome,
                        telefone: dadosCliente.whatsapp,
                        servico_id: Number(servicoSelecionadoId),
                        data_hora: dataHoraFormatada
                    })
                });

                const textoResposta = await resposta.text();
                let resultado = {};
                try {
                    resultado = JSON.parse(textoResposta);
                } catch (e) {
                    resultado = { erro: textoResposta || "Erro desconhecido no servidor" };
                }

                if (resposta.ok) {
                    meuAgendamentoSalvo = {
                        servico: servicoTextoSalvo || 'Corte Selecionado',
                        data: data,
                        horario: horarioSelecionado
                    };

                    alert(`💈 Agendamento confirmado com sucesso!\nEnviamos os detalhes para o WhatsApp (${dadosCliente.whatsapp}).`);
                    abrirMeusAgendamentos();
                } else {
                    alert(`Ops: ${resultado.erro || 'Erro ao processar'}`);
                }
            } catch (erro) {
                console.error("Erro na comunicação com a API:", erro);
                meuAgendamentoSalvo = {
                    servico: servicoTextoSalvo || 'Corte Selecionado',
                    data: data,
                    horario: horarioSelecionado
                };
                alert(`💈 Agendamento realizado com sucesso!`);
                abrirMeusAgendamentos();
            }
        }

        function abrirMeusAgendamentos() {
            const containerLista = document.getElementById('lista-meus-agendamentos');
            if (!containerLista) return;
            
            containerLista.innerHTML = '';

            if (!meuAgendamentoSalvo) {
                containerLista.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 14px; font-weight: 700;">Você não possui nenhum agendamento ativo no momento.</p>';
            } else {
                containerLista.innerHTML = `
                    <div class="card-agendamento-ativo">
                        <p style="margin: 0 0 5px 0;"><strong>Cliente:</strong> ${dadosCliente.nome || 'Visitante'}</p>
                        <p style="margin: 0 0 5px 0;"><strong>Serviço:</strong> ${meuAgendamentoSalvo.servico}</p>
                        <p style="margin: 0 0 5px 0;"><strong>Data:</strong> ${meuAgendamentoSalvo.data}</p>
                        <p style="margin: 0 0 10px 0;"><strong>Horário:</strong> ${meuAgendamentoSalvo.horario}</p>
                        <button class="btn-cancelar" onclick="cancelarAgendamento()">❌ Cancelar / Remarcar</button>
                    </div>
                `;
            }

            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('etapa-3').classList.add('active');
        }

        function cancelarAgendamento() {
            if (confirm('Deseja realmente cancelar este horário para poder remarcar outro?')) {
                meuAgendamentoSalvo = null;
                alert('Agendamento cancelado com sucesso. Você já pode fazer um novo!');
                voltarInicio();
            }
        }
    </script>
</body>
</html>
